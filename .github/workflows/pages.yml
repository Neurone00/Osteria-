name: Deploy to GitHub Pages

# Publishes standalone/index.html — the whole game in one file. No build step,
# so there is nothing here that can go stale or fail on a dependency.
# standalone/index.html is generated by `npm run bundle`; commit it after editing
# src/App.jsx.

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: standalone
      - id: deployment
        uses: actions/deploy-pages@v4
