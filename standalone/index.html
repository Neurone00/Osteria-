 0%{transform:translateY(-120px) rotate(calc(var(--r) + 9deg)) scale(1.5);opacity:0}
 55%{opacity:1}
 74%{transform:translateY(0) rotate(var(--r)) scale(1.05)}

 0%{transform:translate(0,0)}22%{transform:translate(1.5px,-3px)}
