<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E5E0" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Osteria!" />
    <meta name="apple-mobile-web-app-title" content="Osteria!" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Osteria! — scopa, rubamazzo, straccia camicia</title>
    <meta name="description" content="Tre giochi di carte italiani per due giocatori su due telefoni, uniti da un codice di quattro lettere." />
    <style>
      html, body { margin: 0; height: 100%; background: #E7E5E0; overscroll-behavior: none; }
      body { -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
      #root { min-height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register the service worker (makes the app installable on Android) and
      // capture Chrome's install prompt so the home screen can offer it in-app.
      (function () {
        if ("serviceWorker" in navigator) {
          window.addEventListener("load", function () {
            navigator.serviceWorker.register("/sw.js").catch(function () {});
          });
        }
        window.__osteriaBIP = null;
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          window.__osteriaBIP = e;
          window.dispatchEvent(new Event("osteria-installable"));
        });
        window.addEventListener("appinstalled", function () {
          window.__osteriaBIP = null;
          window.dispatchEvent(new Event("osteria-installed"));
        });
      })();
    </script>
    <script>/*BUNDLE*/</script>
  </body>
</html>
